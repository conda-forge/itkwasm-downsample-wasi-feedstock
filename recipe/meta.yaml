{% set name = "itkwasm-downsample-wasi" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/i/itkwasm-downsample-wasi/itkwasm_downsample_wasi-{{ version }}.tar.gz
  sha256: e6fab0fac6fd65bd27a58883b735256b7253e7312298e0f98009f0c5c622e1c3

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - itkwasm
    - importlib-resources

test:
  imports:
    - itkwasm_downsample_wasi
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://pypi.org/project/itkwasm-downsample-wasi/
  summary: Pipelines for downsampling images.
  dev_url: https://github.com/InsightSoftwareConsortium/ITK-Wasm
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - khaled196
    - thewtex
